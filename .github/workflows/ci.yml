name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATHWISE_ENV: test
  PATHWISE_LLM_PROVIDER: fake
  PATHWISE_EMBEDDING_PROVIDER: fake
  PATHWISE_JWT_SECRET: ci-secret-not-a-real-key
  PATHWISE_LOG_LEVEL: WARNING

jobs:
  backend:
    name: backend (lint · types · tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pathwise
          POSTGRES_PASSWORD: pathwise
          POSTGRES_DB: pathwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathwise"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy pathwise

      - name: Migrations apply cleanly
        env:
          PATHWISE_DATABASE_URL: postgresql+asyncpg://pathwise:pathwise@localhost:5432/pathwise_test
        run: alembic upgrade head

      - name: Tests
        env:
          PATHWISE_DATABASE_URL: postgresql+asyncpg://pathwise:pathwise@localhost:5432/pathwise_test
        run: pytest -q --cov=pathwise --cov-report=term-missing

  # The AI evaluation suite gets its own job here once the runner exists
  # (Phase 9). It is deliberately absent rather than stubbed: a job that always
  # passes is a green check that verifies nothing.
