name: pathwise

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathwise}
      POSTGRES_DB: ${POSTGRES_DB:-pathwise}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathwise} -d ${POSTGRES_DB:-pathwise}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: [.env]
    environment:
      PATHWISE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pathwise}:${POSTGRES_PASSWORD:-pathwise}@postgres:5432/${POSTGRES_DB:-pathwise}
      PATHWISE_REDIS_URL: redis://redis:6379/0
    ports:
      - "${PATHWISE_API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - fastembed_cache:/app/.fastembed_cache
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["uvicorn", "pathwise.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: [.env]
    environment:
      PATHWISE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pathwise}:${POSTGRES_PASSWORD:-pathwise}@postgres:5432/${POSTGRES_DB:-pathwise}
      PATHWISE_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - fastembed_cache:/app/.fastembed_cache
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["arq", "pathwise.workers.settings.WorkerSettings"]

volumes:
  pgdata:
  redisdata:
  fastembed_cache:
